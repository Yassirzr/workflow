name: CI-CD - Tests Build Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-cd:
    name: Lint Tests Build Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 20 avec cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier la syntaxe
        run: npm run lint

      - name: Lancer les tests
        run: npm test

      - name: Construire le site
        run: npm run build

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.ACTOR }}
          password: ${{ secrets.TOKEN }}

      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            yassirzr/workflow:latest
            yassirzr/workflow:${{ github.sha }}
